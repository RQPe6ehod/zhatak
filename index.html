<style>
:root{
  --bg:#EAEEF2;--card:#FFFFFF;--ink:#17202C;--muted:#5B6676;--line:#D3DAE2;
  --brand:#0A49C2;--brand-ink:#FFFFFF;--brand-soft:#E3ECFB;
  --free:#1E8A5A;--free-bg:#D7F1E3;--occ:#7A8596;--occ-bg:#DCE1E8;
  --pend:#9A6A00;--pend-bg:#FBEBC0;--debt:#B83226;--debt-bg:#F8DCD8;
  --drum:#151A21;--drum-ink:#F4F6F8;--drum-red:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151C;--card:#18212B;--ink:#E5EAF0;--muted:#93A0B1;--line:#2A3645;
  --brand:#6EA4FF;--brand-ink:#061633;--brand-soft:#132A52;
  --free:#4FD18F;--free-bg:#123526;--occ:#8693A5;--occ-bg:#26303C;
  --pend:#F0C24C;--pend-bg:#3A2F10;--debt:#FF7A6E;--debt-bg:#3D1C1A;
  --drum:#05080B;--drum-ink:#F4F6F8;
}}
:root[data-theme="dark"]{
  --bg:#0F151C;--card:#18212B;--ink:#E5EAF0;--muted:#93A0B1;--line:#2A3645;
  --brand:#6EA4FF;--brand-ink:#061633;--brand-soft:#132A52;
  --free:#4FD18F;--free-bg:#123526;--occ:#8693A5;--occ-bg:#26303C;
  --pend:#F0C24C;--pend-bg:#3A2F10;--debt:#FF7A6E;--debt-bg:#3D1C1A;
  --drum:#05080B;--drum-ink:#F4F6F8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(24px,5vw,36px);line-height:1.12;letter-spacing:-.025em}
h2{font-size:19px;line-height:1.25}
h3{font-size:15px;line-height:1.3}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font-family:Onest,system-ui,sans-serif;font-size:20px;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.tabs{display:flex;gap:4px;overflow-x:auto;margin:18px 0 16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--pend-bg);color:var(--pend);font-size:12px;text-align:center;margin-left:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink);text-decoration:none;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.wa{background:#1FA855;color:#fff}
.btn.danger{background:transparent;border-color:var(--debt);color:var(--debt)}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.intro{padding:26px 0 8px;display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:820px){.intro{grid-template-columns:1.4fr 1fr;align-items:end}}
.intro p{max-width:56ch;margin-top:8px;color:var(--muted)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:14px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}

.floor{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.room{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 14px}
.room header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.room header b{font-family:Onest,system-ui,sans-serif;font-size:17px}
.room header span{font-size:12px;color:var(--muted)}
.room.click{cursor:pointer}
.bunks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.bunk{display:flex;flex-direction:column;gap:4px;border:2px solid var(--line);border-top-width:4px;border-radius:5px;padding:4px}
.bed{height:30px;border:0;border-radius:3px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
.bed.free{background:var(--free-bg);color:var(--free);cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--free)}
.bed.free:hover{background:var(--free);color:var(--card)}
.bed.occ{background:var(--occ-bg);color:var(--occ)}
.bed.pend{background:var(--pend-bg);color:var(--pend)}
.bed.debt{background:var(--debt-bg);color:var(--debt)}
.bed.me{background:var(--brand);color:var(--brand-ink)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:Onest,system-ui,sans-serif;font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:13px}
.stat.red b{color:var(--debt)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:800;border-bottom:0}
tr.clickrow{cursor:pointer}
tr.clickrow:hover td{background:var(--brand-soft)}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--free-bg);color:var(--free)}
.pill.no{background:var(--debt-bg);color:var(--debt)}
.pill.wait{background:var(--pend-bg);color:var(--pend)}

/* The odometer: readings look like the drums on a real meter */
.odo{display:inline-flex;gap:2px;vertical-align:middle}
.odo span{background:var(--drum);color:var(--drum-ink);font:700 17px/1 Onest,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:7px 0;width:19px;text-align:center;border-radius:3px;box-shadow:inset 0 6px 6px -5px rgba(255,255,255,.25),inset 0 -6px 6px -5px rgba(0,0,0,.6)}
.odo span.fr{background:var(--drum-red)}
.odo.sm span{font-size:13px;width:15px;padding:5px 0}

.meters{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.meter{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;border-top:5px solid var(--mc)}
.meter.elec{--mc:#E3A71B}.meter.hot{--mc:#D9473A}.meter.cold{--mc:#2C78C9}
.meter .prev{font-size:13px;color:var(--muted);margin:8px 0 12px}
.meter .prev .odo{margin-top:6px}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:10px;padding:14px;cursor:pointer;font-weight:700;color:var(--brand)}
.photo-btn:hover{border-color:var(--brand)}
.thumb{width:100%;max-height:170px;object-fit:cover;border-radius:8px;margin-top:10px;display:block}
.status{font-size:13px;margin-top:8px;min-height:1em}
.status.ok{color:var(--free)}.status.warn{color:var(--pend)}.status.err{color:var(--debt)}
.fld{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:10px}
.fld input,.fld select{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px;color:var(--ink);font-weight:500}
.fld input:focus,.fld select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.delta{font-size:13px;margin-top:6px;font-weight:600}
.grid2{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

.balance{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.balance b{font-family:Onest,system-ui,sans-serif;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:700}
.item .s{font-size:13px;color:var(--muted)}
.item .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

#modal{position:fixed;inset:0;z-index:50;background:rgba(10,15,22,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
#modal[hidden]{display:none}
#modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){#modal{align-items:center;padding:20px}#modal .sheet{border-radius:16px;padding-bottom:20px}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{margin:40px 0 30px;font-size:13px;color:var(--muted)}
.note{background:var(--brand-soft);border-radius:10px;padding:12px 14px;font-size:14px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:86px;height:86px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--brand)}
.cat{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-top:8px}
.dorm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.dorm h3{font-size:17px}
.bar{height:8px;border-radius:4px;background:var(--occ-bg);overflow:hidden;display:flex}
.bar i{display:block;background:var(--free)}
.dorm .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.back{margin-top:18px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:12px;font-weight:600}
.chk input{width:18px;height:18px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;display:block}
.drop:hover{border-color:var(--brand)}
.code{font-family:Onest,system-ui,sans-serif;font-weight:800;letter-spacing:.12em}
.otp-in{font-size:26px!important;letter-spacing:.4em;text-align:center;font-weight:800!important}
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));counter-reset:st}
.steps div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px}
.steps div b{display:block;font-family:Onest,system-ui,sans-serif;font-weight:600;font-size:14px;margin-bottom:4px}
.steps div b::before{counter-increment:st;content:counter(st) ". ";color:var(--brand)}

.seg.lang button{padding:6px 10px;font-size:13px}
.methods{display:grid;gap:10px}
.method{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);cursor:pointer;font-size:15px}
.method:hover{border-color:var(--brand)}
.method .muted{font-size:13px}
.mi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.mi.wa{background:#1FA855}.mi.tg{background:#2AABEE}.mi.em{background:#5B6676}
.chat{background:#EFE7DD;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.chat.tg{background:#D5E3EE}
.bub{max-width:85%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.4;color:#111}
.bub.out{align-self:flex-end;background:#D9FDD3}
.bub.in{align-self:flex-start;background:#fff}
.tgbtn{border:0;border-radius:10px;padding:10px;background:#fff;color:#2481CC;font-weight:700;cursor:pointer}
.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
.leaflet-tile::selection {
	background: transparent;
}
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}
.leaflet-container img.leaflet-tile {
	mix-blend-mode: plus-lighter;
}
.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
.leaflet-overlay-pane svg {

.mapbox{height:380px;border-radius:12px;border:1px solid var(--line);overflow:hidden;position:relative;z-index:0;isolation:isolate;background:var(--occ-bg)}
.leaflet-container{font-family:Onest,system-ui,sans-serif;font-size:13px}
.leaflet-popup-content{font-size:14px;line-height:1.45;margin:12px 14px}
.pinwrap{background:none;border:0}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 6px));white-space:nowrap;background:var(--brand);color:var(--brand-ink);font:700 12.5px/1.2 Onest,system-ui,sans-serif;padding:5px 9px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.28);cursor:pointer}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--brand)}
.pin small{font-weight:600;opacity:.85;margin-left:6px;font-size:11.5px}
.pin.full{background:var(--occ)}.pin.full::after{border-top-color:var(--occ)}
.pin.uni{background:#fff;color:#17202C;padding:4px 7px}.pin.uni::after{border-top-color:#fff}
.pin.uni.on{background:#17202C;color:#fff;padding:5px 9px}.pin.uni.on::after{border-top-color:#17202C}

.phone{display:flex;align-items:stretch;margin-top:4px;border:1px solid var(--line);border-radius:9px;background:var(--bg);overflow:hidden}
.phone:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.pfx{display:flex;align-items:center;padding:0 10px 0 12px;font-weight:700;font-size:16px;color:var(--ink);background:var(--card);border-right:1px solid var(--line)}
.fld .phone input{border:0;margin:0;border-radius:0;box-shadow:none;background:transparent;flex:1;min-width:0;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.fld .phone input:focus{box-shadow:none}
.phint{display:block;font-weight:500;font-size:12px;margin-top:4px;color:var(--muted)}
.phint.ok{color:var(--free)}

.fld textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font:500 16px/1.45 Onest,system-ui,sans-serif;color:var(--ink);resize:vertical}
.fld textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.catchip input{position:absolute;opacity:0;pointer-events:none}
.catchip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;background:var(--card)}
.catchip input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.catchip input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.tic{font-size:24px;width:40px;height:40px;display:grid;place-items:center;background:var(--bg);border-radius:10px}
.news.imp{border-left:5px solid var(--debt)}
.news.unread h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand);margin-right:8px;vertical-align:2px}

.bell{position:relative;border:1px solid var(--line);background:var(--card);border-radius:9px;width:38px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.bdot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--debt);color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center}
.nitem{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 2px;cursor:pointer;font-size:15px}
.nitem .muted{font-size:12px;white-space:nowrap}
.nitem.unread{font-weight:700}.nitem.unread::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--brand);align-self:center}

.logo-mark{width:40px;height:40px;border-radius:10px;box-shadow:0 0 0 1px var(--line);flex:none;background:#fff}
.logo-word{display:block;height:22px;width:auto}
.brand small{margin-top:3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-word{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .logo-word{filter:brightness(0) invert(1)}
</style>

function bedMap(d,mode){

    out+=`<div class="floor"><h2>${t('floorN',{n:f})}</h2><span class="muted">${t('freeN',{n:free})}</span></div><div class="rooms">`;
    for(const r of rooms){
      const nfree=r.beds.filter(b=>!occupant(b.id)).length;
      const btn=b=>{const o=occupant(b.id);let cls='occ',st=t('st_occ'),extra='';
        if(!o){cls='free';st=t('st_free')+(b.type!=='single'?', '+t('bed_'+b.type):'');if(mode==='student')extra=`data-a="book" data-bed="${b.id}" data-room="${r.id}"`}
        else if(o.status==='pending'){cls='pend';st=t('st_req')}else if(me&&o.id===me.id){cls='me';st=t('st_mine')}else if(mode==='owner'&&debtOf(o.id)>0){cls='debt';st=t('st_debt')}
        return `<button class="bed ${cls}" ${extra} title="${st}" aria-label="${t('bedAria',{n:b.n,s:st})}" ${extra?'':'tabindex="-1"'}>${b.n}</button>`};
      let inner='';
      if(d.bunks){for(let i=0;i<r.beds.length;i+=2)inner+=`<div class="bunk">${r.beds[i+1]?btn(r.beds[i+1]):''}${btn(r.beds[i])}</div>`}else inner=r.beds.map(b=>`<div class="bunk">${btn(b)}</div>`).join('');
      const cols=Math.min(4,d.bunks?Math.ceil(r.beds.length/2):r.beds.length);
      out+=`<div class="room${mode==='owner'?' click':''}" ${mode==='owner'?`data-a="room" data-room="${r.id}" tabindex="0"`:''}><header><b>${r.id}</b><span>${nfree?t('freeOf',{n:nfree,t:r.beds.length}):t('noBeds')}</span></header><div class="bunks" style="grid-template-columns:repeat(${cols},1fr)">${inner}</div></div>`;
    }

}

let lfP=null,LMAP=null,pickLL=null;
function loadLeaflet(){if(window.L)return Promise.resolve();if(lfP)return lfP;
  const add=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  lfP=add('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js').catch(()=>add('https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js')).catch(e=>{lfP=null;throw e});return lfP}

  pickLL=null;if(LMAP){try{LMAP.remove()}catch(e){}LMAP=null}
  const el=$('#catmap')||$('#ownmap')||$('#wzmap');if(!el)return;

function buildMap(el){
  const map=L.map(el,{scrollWheelZoom:false});LMAP=map;
  let warned=false;
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).on('tileerror',()=>{if(!warned){warned=true;const w=$('#maperr');if(w)w.hidden=false}}).addTo(map);
  if(el.id==='catmap'){
    const c=curCity(),ref=refPoint(),pts=[];
    for(const {d,dist} of catalogList()){if(!d.ll)continue;const f=freeCount(d);
      const m=L.marker(d.ll,{icon:pinIcon(`${esc(d.name)}<small>${f}</small>`,f?'':'full')}).addTo(map);pts.push(d.ll);
      m.bindPopup(`<b>${esc(d.name)}</b><br>${esc(d.address)}<br>${t('freeOfShort',{n:f,t:bedCount(d)})}<br>${t('fromPrice',{p:money(Math.min(d.tariffs.rentLower,d.bunks?d.tariffs.rentUpper:Infinity))})}${dist!=null?`<br><b>${t('kmFrom',{km:nf(dist,{maximumFractionDigits:1}),p:esc(ref.name)})}</b>`:''}<br><button class="btn sm" style="margin-top:8px" data-a="openDorm" data-id="${d.id}" ${f?'':'disabled'}>${f?t('chooseBed'):t('full')}</button>`)}
    for(const u of UNI_MAP.filter(u=>u.city===c)){const on=ref&&!ui.myLoc&&u.id===ui.mapUni;
      L.marker(u.ll,{icon:pinIcon('🎓 '+(on?esc(u.name):''),'uni'+(on?' on':'')),zIndexOffset:on?1000:0}).addTo(map).bindTooltip(esc(u.name)).on('click',()=>{ui.mapUni=u.id;ui.myLoc=null;render()})}
    if(ui.myLoc)L.marker(ui.myLoc,{icon:pinIcon('📍 '+t('myLocName'),'uni on'),zIndexOffset:1000}).addTo(map);
    if(ref)pts.push(ref.ll);

// Headers are recognised in Kazakh, Russian and English
const H_NAME=/фио|аты-?жөні|аты жөні|full ?name|^name$|student/,H_PHONE=/тел|phone|ұялы/,H_PAR=/родит|ата-?ана|parent/,H_UNI=/наимен|универ|вуз|оқу|жоо|univ|college|school/,H_ROOM=/комн|бөлме|room/,H_PLACE=/^мест|место|орын|^bed|place/;
const V_UP=/верх|жоғар|upper|top/i,V_LO=/нижн|төмен|lower|bottom/i;
function parseRows(rows){
  const h=rows.findIndex(r=>r.some(c=>H_NAME.test(String(c).toLowerCase().trim())));if(h<0)return{error:true};
  const H=rows[h].map(c=>String(c).toLowerCase().trim()),body=rows.slice(h+1),ncol=Math.max(...rows.map(r=>r.length));
  const ci=re=>H.findIndex(c=>re.test(c)),score=(i,re)=>body.filter(r=>re.test(String(r[i]??'').trim())).length;
  const cName=ci(H_NAME),cPar=ci(H_PAR),cUni=ci(H_UNI);let cPhone=H.findIndex(c=>H_PHONE.test(c)&&!H_PAR.test(c));
  let cPlace=ci(H_PLACE);if(cPlace<0){let b=-1,bs=0;for(let i=0;i<ncol;i++){const s=body.filter(r=>V_UP.test(r[i])||V_LO.test(r[i])).length;if(s>bs){bs=s;b=i}}cPlace=b}
  let cRoom=ci(H_ROOM);if(cRoom<0){let b=-1,bs=0;for(let i=0;i<cName;i++){const s=score(i,/^\d{3,4}$/);if(s>bs){bs=s;b=i}}cRoom=b}
  if(cPhone<0){let b=-1,bs=0;for(let i=0;i<ncol;i++){if(i===cPar)continue;const s=score(i,/^[\s+]*[78][\d\s-]{9,}$/);if(s>bs){bs=s;b=i}}cPhone=b}
  let room=null;const out=[];
  for(const r of body){
    const rv=cRoom>=0?String(r[cRoom]??'').trim():'';if(/^\d{3,4}$/.test(rv))room=rv;
    const name=String(r[cName]??'').trim().replace(/\s+/g,' ');if(name.split(' ').length<2||H_NAME.test(name.toLowerCase()))continue;
    const place=cPlace>=0?String(r[cPlace]??''):'',pm=cPar>=0?String(r[cPar]??'').replace(/[\s-]/g,'').match(/[78]\d{10}/):null;
    out.push({room,name,phone:cPhone>=0?normPhone(r[cPhone]):'',uni:cUni>=0?String(r[cUni]??'').trim():'',parentPhone:pm?normPhone(pm[0]):'',type:V_UP.test(place)?'upper':V_LO.test(place)?'lower':''});
  }
  return{rows:out};
}
function planImport(d,parsed){

    if(r.phone&&findByPhone(S.residents.filter(z=>z.status!=='left'),r.phone)){x.st='dup';return x}
    if(!r.room){x.st='noroom';return x}
    let room=roomOf(d,r.room),isNew=false;if(!room){room=newRooms[r.room]||(newRooms[r.room]=makeRoom(d.id,r.room,d.bedsPerRoom,d.bunks));isNew=true}

  importPlan={dormId:d.id,sheet:parsed.sheet,rows,newRooms};render();
}

async function shrink(file,max){const url=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.62)}finally{URL.revokeObjectURL(url)}}
async function onPhoto(k,file){
  const me=res(ui.sid),d=dorm(me.dormId),lr=lastReading(d,me.roomId),st=$('#st-'+k),m=METERS[k],u=t(m.unit);
  try{meter[k].photo=await shrink(file,420)}catch(e){st.className='status err';st.textContent=t('photoOpenErr');return}
  const th=$('#th-'+k);th.src=meter[k].photo;th.hidden=false;$('#pb-'+k).textContent=t('resnap');
  if(!sampleFn||!canImg){st.className='status warn';st.textContent=t('photoAttached');return}
  st.className='status';st.innerHTML=`<span class="spin"></span> ${t('recognizing')}`;
  const kind={elec:'electricity meter (kWh)',hot:'hot water meter (m³)',cold:'cold water meter (m³)'}[k],langName={ru:'Russian',kk:'Kazakh',en:'English'}[ui.lang];
  const prompt=`The photo shows a utility meter: ${kind}.${lr?` Its previous reading was ${lr[k]}; the current one should not be lower and is usually only slightly higher.`:''}
Read the main counter. Black or white digits are the integer part; red digits or digits after the decimal point are the fractional part. Do not confuse it with the serial number, year of manufacture or other labels.
Reply with JSON only: {"value": number or null, "confidence": "high" or "low", "note": "a short note in ${langName} if the photo is unclear or not a meter, otherwise an empty string"}`;
  try{const r=await sampleFn.json(prompt,{images:[file]});
    if(r&&typeof r.value==='number'){const v=+r.value.toFixed(m.dec);meter[k].val=decStr(v);$('#mv-'+k).value=meter[k].val;const low=r.confidence!=='high'||(lr&&v<lr[k]);
      st.className='status '+(low?'warn':'ok');st.textContent=low?t('recLow',{v:meter[k].val,n:r.note?': '+r.note:''}):t('recOk',{v:meter[k].val,u});updatePreview()}
    else{st.className='status warn';st.textContent=(r&&r.note?r.note+'. ':'')+t('recFail')}
  }catch(e){st.className='status warn';st.textContent=e&&e.code==='not_granted'?t('recDenied'):e&&e.code==='rate_limited'?t('recRate'):t('recErr');if(e&&(e.code==='not_granted'||e.code==='images_unavailable'))canImg=false}
}

    if(!v('#wz-name')||!v('#wz-city')){err.textContent=t('wzErrName');return}if(!(floors>=1&&floors<=40&&per>=1&&per<=60)){err.textContent=t('wzErrSize');return}if(lo==null||(bunks&&up==null)){err.textContent=t('wzErrRent');return}
    if(beds%2)bunks=false;const id='d'+(S.seq++);
    S.dorms.push({id,ll:pickLL,name:v('#wz-name'),city:v('#wz-city'),address:v('#wz-addr')||'—',ownerId:ui.oid,bedsPerRoom:beds,bunks,tariffs:{...DEF_T,rentLower:lo,rentUpper:bunks?up:lo},rooms:makeRooms(id,floors,per,beds,bunks),readings:{},rentMonths:[todayISO().slice(0,7)],status:'active',created:todayISO()});
    ui.dormId=id;ui.wizard=null;ui.otab='import';save();render();top0();toast(t('dormCreated'))},
  pickDorm:d=>{ui.dormId=d.id;importPlan=null;render()},
  room:d=>roomModal(d.room),resident:d=>residentModal(d.id),group:d=>groupModal(d.k),
  markPaid:d=>{const s=S.bills.find(x=>x.id===d.b).shares.find(x=>x.rid===d.id);s.paid=true;s.paidAt=todayISO();s.via='cash';save();render();d.k?groupModal(d.k):residentModal(d.id);toast(t('paymentMarked'))},
  approve:d=>{const r=res(d.id);r.status='active';notify([r.id],'n_approved',{r:r.roomId},'bills');save();render();toast(t('approved',{n:r.name}))},
  reject:d=>{if(!confirm(t('rejectQ')))return;S.residents=S.residents.filter(r=>r.id!==d.id);save();render();toast(t('rejected'))},
  evict:d=>{const r=res(d.id);if(!confirm(t('evictQ',{n:r.name})))return;r.status='left';r.bedId=null;r.roomId=null;save();closeModal();render();toast(t('moved'))},
  reinvite:()=>{const d=D();toast(t('reinvSent',{n:S.residents.filter(r=>r.dormId===d.id&&r.invited&&!r.joined).length}))},
  genRent:d=>{const dm=D(),m=d.m;if(dm.rentMonths.includes(m)){toast(t('rentExists'));return}const act=S.residents.filter(r=>r.dormId===dm.id&&r.status==='active');
    for(const r of act){const b=bedOf(r),amt=priceOf(dm,b);S.bills.push({id:'i'+(S.seq++),dormId:dm.id,type:'rent',roomId:r.roomId,month:m,lines:[rentLine(b.type,amt)],total:amt,created:todayISO(),shares:[{rid:r.id,amount:amt,paid:false,paidAt:null}]});notify([r.id],'n_bill',{bill:S.bills[S.bills.length-1].id,amount:amt},'bills')}
    dm.rentMonths.push(m);save();render();toast(t('rentIssued',{n:act.length}))},
  saveTariffs:()=>{const T={};let bad=false;document.querySelectorAll('[data-t]').forEach(i=>{const v=num(i.value);if(v==null||v<0)bad=true;else T[i.dataset.t]=v});if(bad){toast(t('numsNeeded'));return}Object.assign(D().tariffs,T);save();toast(t('tariffsSaved'))},
  importSample:()=>planImport(D(),{...parseRows(SAMPLE),sheet:t('sampleSheet')}),importGo,importCancel:()=>{importPlan=null;render()},
  appApprove:d=>{const a=S.applications.find(x=>x.id===d.id);a.status='approved';const inv=newInvite({ownerName:a.name,phone:a.phone,dormName:a.dormName,city:a.city});save();ui.atab='invites';render();toast(t('invCreated',{l:'ornalas.kz/i/'+inv.code}))},
  appReject:d=>{if(!confirm(t('rejectAppQ')))return;S.applications.find(x=>x.id===d.id).status='rejected';save();render()},
  inviteCreate:()=>{const v=id=>$(id).value.trim(),err=$('#iv-err'),o={ownerName:v('#iv-name'),phone:normPhone(v('#iv-phone')),dormName:v('#iv-dorm'),city:v('#iv-city')};
    if(!o.ownerName||!o.dormName||!o.city){err.textContent=t('fillAll');return}if(!o.phone){err.textContent=t('phoneErr');return}const inv=newInvite(o);save();render();toast(t('invCreated',{l:'ornalas.kz/i/'+inv.code}))},
  openInvite:d=>{ui.role='owner';ui.oid=null;ui.inviteCode=d.code;render();top0()},
  adminLogin:()=>{const p=$('#adminPhone').value;if(digits(p).length!==10){$('#ad-err').textContent=t('phone11');return}
    const a=findByPhone(S.admins,p);if(!a){$('#ad-err').textContent=t('noAccess');return}
    verify(a.phone,t('platLoginH'),()=>{ui.aid=a.id;ui.role='admin';ui.atab='dorms';render();top0()})},
  adminSetup:()=>{const name=$('#ad-name').value.trim(),p=normPhone($('#adminPhone').value);if(!name){$('#ad-err').textContent=t('fillAll');return}if(!p){$('#ad-err').textContent=t('phoneErr');return}
    verify(p,t('confirmPhone'),()=>{if(S.admins.length){render();return}const a={id:'p'+(S.seq++),name,phone:p,role:'super'};S.admins.push(a);save();ui.aid=a.id;ui.role='admin';ui.atab='dorms';render();top0()})},
  adminLogout:()=>{ui.aid=null;ui.role='student';render();top0()},
  addAdmin:()=>{const me=meAdmin();if(!me||me.role!=='super')return;const name=$('#na-name').value.trim(),p=normPhone($('#na-phone').value),err=$('#na-err');
    if(!name){err.textContent=t('fillAll');return}if(!p){err.textContent=t('phoneErr');return}if(findByPhone(S.admins,p)){err.textContent=t('adminExists');return}
    S.admins.push({id:'p'+(S.seq++),name,phone:p,role:$('#na-role').value});save();render();toast(t('adminAdded',{n:name}))},
  removeAdmin:d=>{const me=meAdmin(),a=S.admins.find(x=>x.id===d.id);if(!me||me.role!=='super'||!a||a.id===me.id)return;if(!confirm(t('removeQ',{n:a.name})))return;S.admins=S.admins.filter(x=>x.id!==a.id);save();render();toast(t('accessRemoved'))},
  saveLoc:()=>{if(!pickLL)return;D().ll=pickLL;save();render();toast(t('locSaved'))},
  myLoc:()=>{if(!navigator.geolocation){toast(t('locErr'));return}navigator.geolocation.getCurrentPosition(p=>{ui.myLoc=[p.coords.latitude,p.coords.longitude];ui.mapUni=null;render()},()=>toast(t('locErr')),{timeout:8000})},
  bell:()=>{const me=res(ui.sid),list=myNotifs(me.id);
    const perm='Notification' in window?Notification.permission:'unsupported',on=perm==='granted'&&ui.pushRid===me.id;
    openModal(sheetHead(t('bell'))+`<div class="stack"><div>${list.map(n=>`<button class="nitem${n.read?'':' unread'}" data-a="openNotif" data-id="${n.id}"><span class="grow">${esc(notifText(n))}</span><span class="muted">${fmtD(n.created)}</span></button>`).join('')||`<p class="muted">${t('noNotifs')}</p>`}</div>
      <div class="card stack" style="background:var(--bg)">${on?`<p class="status ok">${t('pushEnabled')}</p>`:perm==='denied'?`<p class="status warn">${t('pushDenied')}</p>`:perm==='unsupported'?`<p class="status warn">${t('pushUnsupported')}</p>`:`<div><button class="btn" data-a="pushOn">${t('pushOn')}</button></div>`}<p class="muted" style="font-size:13px">${t('pushNote')}</p></div></div>`);
    list.forEach(n=>n.read=true);save();const b=document.querySelector('.bell .bdot');if(b)b.remove()},
  openNotif:d=>{const n=S.notifs.find(x=>x.id===d.id);closeModal();if(n&&n.go)A.stab({v:n.go});else render()},
  pushOn:async()=>{try{const p=await Notification.requestPermission();if(p==='granted'){ui.pushRid=ui.sid;saveUi();new Notification('Ornalas',{body:t('pushEnabled')})}A.bell()}catch(e){toast(t('pushUnsupported'))}},
  sftab:d=>{ui.sftab=d.v;render()},tkf:d=>{ui.tkf=d.v;render()},
  tkSend:()=>{const me=res(ui.sid),text=$('#tk-text').value.trim(),cat=(document.querySelector('input[name=tk-cat]:checked')||{}).value||'other';if(!text){$('#tk-err').textContent=t('ticketErr');return}
    S.tickets.push({id:'t'+(S.seq++),dormId:me.dormId,roomId:me.roomId,rid:me.id,cat,text,photo:tkPhoto,status:'new',created:todayISO(),updated:todayISO(),comment:''});tkPhoto=null;save();render();toast(t('ticketSent'))},
  tkWork:d=>{const x=S.tickets.find(y=>y.id===d.id);x.status='work';x.updated=todayISO();notify([x.rid],'n_tkWork',{cat:x.cat},'maint');save();render();toast(t('ticketUpd'))},
  tkDone:d=>{const x=S.tickets.find(y=>y.id===d.id);openModal(sheetHead(t('markDone'),`${t('cat_'+x.cat)}, ${t('roomH',{r:x.roomId})}`)+`<div class="stack"><label class="fld">${t('doneComment')}<textarea id="tk-com" rows="3"></textarea></label><div><button class="btn" data-a="tkDoneGo" data-id="${x.id}">${t('markDone')}</button></div></div>`)},
  tkDoneGo:d=>{const x=S.tickets.find(y=>y.id===d.id);x.status='done';x.comment=$('#tk-com').value.trim();x.updated=todayISO();notify([x.rid],'n_tkDone',{cat:x.cat},'maint');save();closeModal();render();toast(t('ticketUpd'))},
  pubNews:()=>{const title=$('#nw-title').value.trim(),text=$('#nw-text').value.trim();if(!title||!text){$('#nw-err').textContent=t('newsErr');return}
    const d=D(),by=meStaff()?meStaff().name:(S.owners.find(o=>o.id===ui.oid)||{}).name||'';S.anns.push({id:'n'+(S.seq++),dormId:d.id,title,text,important:$('#nw-imp').checked,by,created:todayISO(),readBy:[]});notify(S.residents.filter(r=>r.dormId===d.id&&r.status==='active').map(r=>r.id),'n_ann',{t:title},'news');save();render();toast(t('published'))},
  delNews:d=>{if(!confirm(t('delNewsQ')))return;S.anns=S.anns.filter(n=>n.id!==d.id);save();render()},
  addStaff:()=>{const d=D(),name=$('#sf-name').value.trim(),p=normPhone($('#sf-phone').value),err=$('#sf-err');if(!name){err.textContent=t('fillAll');return}if(!p){err.textContent=t('phoneErr');return}
    if(S.staff.some(s=>s.dormId===d.id&&digits(s.phone)===digits(p))){err.textContent=t('staffExists');return}S.staff.push({id:'s'+(S.seq++),dormId:d.id,name,phone:p});save();render();toast(t('staffAdded',{n:name}))},
  rmStaff:d=>{const s=S.staff.find(x=>x.id===d.id);if(!confirm(t('staffRemoveQ',{n:s.name})))return;S.staff=S.staff.filter(x=>x.id!==s.id);save();render();toast(t('staffRemoved'))},
  adminOpenDorm:d=>{const dm=dorm(d.id);ui.role='owner';ui.oid=dm.ownerId;ui.dormId=dm.id;ui.otab='overview';ui.wizard=null;render();top0()}
};

/* ================= wiring ================= */
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){otp=null;vst=null;closeModal()}});
document.addEventListener('click',e=>{if(e.target.closest('[data-stop]'))return;const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('keydown',e=>{
  const el=e.target;if(e.key==='Backspace'&&el.matches&&el.matches('[data-phone]')&&el.selectionStart===el.selectionEnd){
    const pos=el.selectionStart,before=phoneDigits(el.value.slice(0,pos)).length,d=phoneDigits(el.value);if(before>0){e.preventDefault();const nd=d.slice(0,before-1)+d.slice(before);phoneSet(el,nd);
      let c=0,i=0;const v=el.value;while(i<v.length&&c<before-1){if(/\d/.test(v[i]))c++;i++}el.setSelectionRange(i,i)}return}if(e.key==='Escape'&&!$('#modal').hidden){otp=null;vst=null;closeModal();return}if(e.key!=='Enter')return;const id=e.target.id;
  if(id==='loginPhone')A.login();else if(id==='adminPhone')(S.admins.length?A.adminLogin():A.adminSetup());else if(id==='ownerPhone')A.ownerLogin();else if(id==='otp')otpCheck();else if(id==='v-email')A.vEMsend();else{const el=e.target.closest('.room.click');if(el)roomModal(el.dataset.room)}});
document.addEventListener('change',e=>{if(e.target.id==='tk-photo'&&e.target.files[0]){shrink(e.target.files[0],600).then(u=>{tkPhoto=u;const th=$('#tk-th');th.src=u;th.hidden=false;$('#tk-pl').textContent=t('resnap')}).catch(()=>toast(t('photoOpenErr')));return}if(e.target.id==='map-city'){ui.mapCity=e.target.value;ui.mapUni=null;ui.myLoc=null;render();return}if(e.target.id==='map-uni'){ui.mapUni=e.target.value||null;ui.myLoc=null;render();return}const k=e.target.dataset.photo;if(k&&e.target.files[0])onPhoto(k,e.target.files[0]);if(e.target.id==='im-file'&&e.target.files[0])readFile(e.target.files[0]);if(e.target.id&&e.target.id.startsWith('wz-'))wizardSummary()});
document.addEventListener('input',e=>{if(e.target.id==='res-q'){const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#res-tbl tbody tr').forEach(tr=>{tr.hidden=!!q&&!tr.dataset.q.includes(q)});return}if(e.target.matches&&e.target.matches('[data-phone]')){phoneSet(e.target,phoneDigits(e.target.value));return}const k=e.target.dataset.mv;if(k){meter[k].val=e.target.value;updatePreview()}if(e.target.id==='otp'&&e.target.value.length===4)otpCheck();if(e.target.id&&e.target.id.startsWith('wz-'))wizardSummary()});

render();if(ui.stab==='meters')updatePreview();wizardSummary();
(async()=>{try{if(!window.claude||!window.claude.use)return;sampleFn=await window.claude.use('sample');if(sampleFn){const l=await sampleFn.limits().catch(()=>null);canImg=!!(l&&l.images)}if(ui.role==='student'&&ui.stab==='meters'&&ui.sid){render();updatePreview()}}catch(e){}})();

</script>
</body>
